{% extends "base.html" %}
{% block title %}Delete job{% endblock %}
{% block content %}
<section class="mx-auto max-w-lg px-4 py-16 sm:px-6">
  <h1 class="font-display text-3xl font-bold">Delete "{{ job.title }}"?</h1>
  <p class="mt-3 text-sm text-muted">This also deletes every application sent to this job. To stop new applications without losing them, close the job instead.</p>
  <form method="post" class="mt-6 flex items-center gap-3">
    {% csrf_token %}
    <button type="submit" class="rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-red-700">Delete job</button>
    <a href="{% url 'jobs:employer_dashboard' %}" class="text-sm font-medium text-muted hover:text-ink">Keep it</a>
  </form>
</section>
{% endblock %}
