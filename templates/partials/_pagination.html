{% load ui %}
{% if page_obj.paginator.num_pages > 1 %}
<nav class="mt-6 flex items-center justify-between gap-3 text-sm" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a href="{% page_url page_obj.previous_page_number %}" class="rounded-lg border border-line bg-white px-3.5 py-2 font-medium hover:bg-tint">Previous</a>
  {% else %}<span></span>{% endif %}
  <p class="text-muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</p>
  {% if page_obj.has_next %}
    <a href="{% page_url page_obj.next_page_number %}" class="rounded-lg border border-line bg-white px-3.5 py-2 font-medium hover:bg-tint">Next</a>
  {% else %}<span></span>{% endif %}
</nav>
{% endif %}
