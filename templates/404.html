{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl px-4 py-24 text-center">
  <h1 class="font-display text-3xl font-bold">We can't find that page</h1>
  <p class="mt-3 text-muted">The link may be old, or the job may have been closed by the employer.</p>
  <a href="{% url 'jobs:list' %}" class="mt-6 inline-block rounded-lg bg-brand px-4 py-2.5 text-sm font-medium text-white hover:bg-brand-dark">Browse open jobs</a>
</section>
{% endblock %}
